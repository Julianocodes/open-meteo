<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Meteo - Juliano</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="d-flex gap-2 align-items-center">
        <input
          id="cidade"
          type="text"
          class="form-control"
          placeholder="Digite uma cidade"
        />

        <button id="buscar" class="btn btn-primary px-4">Buscar</button>
      </div>
    </div>

    <div class="info">
      <div class="weather-card">
        <span>🌡️ Temperatura</span>
        <p id="temperatura"></p>
      </div>

      <div class="weather-card">
        <span>💨 Velocidade do vento</span>
        <p id="vento"></p>
      </div>

      <p id="erro"></p>
      <p id="mensagem"></p>
    </div>

    <!-- <div class="info">
      <p id="temperatura"></p>
      <p id="vento"></p>
      <p id="erro"></p>
      <p id="mensagem"></p>
    </div> -->

    <script src="script.js"></script>
  </body>
</html>
